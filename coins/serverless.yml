useDotenv: true
service: coins

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x             # match your Docker node
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${env:STAGE, 'local'}    # local by default when running offline
  memorySize: 250
  endpointType: REGIONAL
  environment:
    ETHEREUM_RPC: ${env:ETHEREUM_RPC, ''}
    BSC_RPC: ${env:BSC_RPC, ''}
    POLYGON_RPC: ${env:POLYGON_RPC, ''}
    FANTOM_RPC: ${env:FANTOM_RPC, ''}
    ARBITRUM_RPC: ${env:ARBITRUM_RPC, ''}
    OPTIMISM_RPC: ${env:OPTIMISM_RPC, ''}
    XDAI_RPC: ${env:XDAI_RPC, ''}
    HARMONY_RPC: ${env:HARMONY_RPC, ''}
    SOLANA_RPC: ${env:SOLANA_RPC, ''}
    MISSING_COINS_DB_PWD: ${env:MISSING_COINS_DB_PWD, ''}
    R2_ACCESS_KEY_ID: ${env:R2_ACCESS_KEY_ID, ''}
    R2_SECRET_ACCESS_KEY: ${env:R2_SECRET_ACCESS_KEY, ''}
    R2_ENDPOINT: ${env:R2_ENDPOINT, ''}
    # if you use DynamoDB locally, pass the endpoint:
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}

custom:
  stage: ${opt:stage, self:provider.stage}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    concurrency: 4
  # serverless-offline options (optional)
  serverless-offline:
    host: 0.0.0.0
    httpPort: 3000
    lambdaPort: 3002

  # dynamodb-local (optional)
  dynamodb:
    stages:
      - local
    start:
      port: 8000
      inMemory: true
      migrate: true

functions:
  storeDefiCoins:
    handler: src/storeCoins.default
    timeout: 900            # offline ignores API GW 30s limit
    memorySize: 1024
    environment:
      STALE_COINS_ADAPTERS_WEBHOOK: ${env:STALE_COINS_ADAPTERS_WEBHOOK, ''}
    events:
      - httpApi:
          path: /storeDefiCoins
          method: post

  StoreBridgedCoins:
    handler: src/storeBridgedCoins.default
    timeout: 900
    memorySize: 1024
    events:
      - schedule: cron(45 * * * ? *)
    environment:
      R2_ACCESS_KEY_ID: ${env:R2_ACCESS_KEY_ID, ''}
      R2_SECRET_ACCESS_KEY: ${env:R2_SECRET_ACCESS_KEY, ''}
      R2_ENDPOINT: ${env:R2_ENDPOINT, ''}

# Comment out remote resources for local runs
resources: []

plugins:
  - serverless-esbuild
  - serverless-offline
  # - serverless-dynamodb-local   # uncomment if you want DynamoDB Local
  - serverless-prune-plugin
  - serverless-plugin-log-retention
